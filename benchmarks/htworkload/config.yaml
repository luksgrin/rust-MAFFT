# Defaults for benchmarks/htworkload/Snakefile; `benchmarks/htworkload.py`
# overrides `impl`, `clusters` and `outdir` with --config. Relative paths
# are resolved against the repository root.

# c: the in-tree C build (mafft-upstream/scripts/mafft, MAFFT_BINARIES set)
# rust: target/release/mafft-rs
impl: c

# TSV, one cluster per line: <id> <molecule: dna|protein> <input FASTA>
clusters: target/htworkload/clusters.tsv
outdir: target/htworkload/snakemake_out

mafft: mafft-upstream/scripts/mafft
mafft_binaries: mafft-upstream/binaries
mafft_rs: target/release/mafft-rs

# Per-molecule flags. DNA is the panaroo command line (issue #1); protein
# pins --thread 1 as well, so each job uses one core (mafft-rs without
# --thread would use all of them).
flags:
  dna: "--auto --adjustdirection --thread 1 --nuc"
  protein: "--auto --thread 1"
