name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mafft-rs
          - os: macos-13
            target: x86_64-apple-darwin
            binary: mafft-rs
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mafft-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mafft-rs.exe
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p mafft-bin --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mafft-rs-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mafft-rs-${{ matrix.target }}.zip ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mafft-rs-${{ matrix.target }}
          path: mafft-rs-${{ matrix.target }}.*

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mafft-rs-${{ matrix.target }}.*
