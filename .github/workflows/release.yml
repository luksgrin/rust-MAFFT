name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

# `softprops/action-gh-release@v2` updates the release object to attach
# the built binaries as assets. That's a write to the `contents` scope —
# and since 2023, GH defaults workflow tokens to read-only. Grant the
# minimum needed: `contents: write`, nothing else.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mafft-rs
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: mafft-rs
            # Cross-compile via `cross` (Docker-backed). Host runner is
            # x86_64; the target binary runs on AWS Graviton / Apple
            # silicon Linux containers / Raspberry Pi 64-bit.
            use_cross: "true"
          # macos-latest is Apple Silicon; we cross-compile to
          # x86_64-apple-darwin from it. The retired macos-13 runner
          # was the native Intel host but has been removed by GitHub as
          # of 2026.
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: mafft-rs
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: mafft-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mafft-rs.exe
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux)
        if: matrix.use_cross == 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build -p mafft-rs --release --target ${{ matrix.target }}
          else
            cargo build -p mafft-rs --release --target ${{ matrix.target }}
          fi

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mafft-rs-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mafft-rs-${{ matrix.target }}.zip ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mafft-rs-${{ matrix.target }}
          path: mafft-rs-${{ matrix.target }}.*

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mafft-rs-${{ matrix.target }}.*
