name: Build and test (reusable)

# Reusable "build the C reference in-tree, build the Rust workspace, run
# the unit + integration + FFI cross-validation suites" job. It is
# invoked from ci.yml once per reference platform:
#
#   * ubuntu-latest    (x86-64, gcc)         -> byte-identity vs a non-contracting C build
#   * ubuntu-24.04-arm (aarch64, gcc -std=c99) -> same, and gcc emits 0 fused ops here
#   * macos-latest     (arm64, Apple clang)  -> byte-identity vs an FMA-contracting C build
#
# Why more than one platform: C MAFFT 7.526 leaves -ffp-contract unset, so
# the compiler, not the source, chooses the rounding. Apple clang contracts
# a*b+c into fused multiply-adds (on the order of a thousand fmadd-family
# instructions per binary). gcc in the Makefile's -std=c99 mode emits none,
# including on Linux aarch64, where the CPU has FMA hardware. The builds
# therefore disagree on some inputs (e.g. `--bl 50` on
# mafft-upstream/test/sample: 712 columns with Apple clang, 738 with gcc),
# and "byte-identical to C" is only meaningful relative to a C build made
# on the same platform. The reference is the pinned mafft-upstream source,
# built in-tree with the upstream Makefile's default flags, on the platform
# you run on (never a downloaded binary). rust-MAFFT mirrors this:
# `mafft_types::fp::CONTRACTS_FMA` defaults to the usual compiler for the
# target (true on Apple, false elsewhere, including Linux aarch64), and
# the FFI cross_validate_* tests compare against the C compiled by
# mafft-c-bindings/build.rs on the same runner. Running this job on each
# runner is what makes that claim checked rather than asserted.
#
# macOS toolchain notes: mafft-upstream/core/Makefile hardcodes
# `CC = gcc` and `CFLAGS = -O3 -std=c99 -Denablemultithread`, all of
# which Apple's `gcc` shim (= clang) accepts; no `CC=clang` override or
# other env is needed. The `all` target also copies the binaries into
# mafft-upstream/binaries/ and the wrapper scripts into
# mafft-upstream/scripts/, which is what `MAFFT_BINARIES` below relies on.

on:
  workflow_call:
    inputs:
      os:
        description: Runner label (ubuntu-latest, ubuntu-24.04-arm, or macos-latest)
        required: true
        type: string
      expect-zero-fused:
        description: >-
          Fail the job unless scripts/fma_census.sh reports 0 fused ops in
          every C engine binary. Set on Linux, including aarch64, where gcc
          -std=c99 must not contract.
        required: false
        type: boolean
        default: false
      expect-sentinel-width:
        description: >-
          If non-empty, the --bl 50 sentinel must have this column count on
          both the mafft-rs and the in-tree C alignments (738 for gcc,
          712 for Apple clang).
        required: false
        type: string
        default: ""
      cargo-exclude:
        description: >-
          Extra `--exclude <crate>` flags for the workspace cargo invocations
          (e.g. "--exclude pymafft" on macOS, where the pyo3 cdylib needs
          maturin's linker setup rather than a plain `cargo build`).
        required: false
        type: string
        default: ""
      upload-artifacts:
        description: >-
          Upload the C test bundle + mafft-rs binary for the downstream
          "Test C:" / "Test Rust:" jobs. Only one platform should do this,
          since the artifact names are fixed.
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build and test
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Toolchain report
        run: |
          echo "host: $(uname -m) / $(uname -s)"
          cc --version | head -1
          rustc --version
          cargo --version

      - name: Build C binaries
        run: make -C mafft-upstream/core

      # Every CI log states which contraction behaviour the C reference
      # used on this runner has, so a byte-identity result can never be
      # read out of context. The inline census always runs (it only needs
      # objdump, available on these runners: binutils on Linux,
      # llvm-objdump via Xcode on macOS); scripts/fma_census.sh (added
      # alongside the fp-policy code) runs in addition when present.
      - name: FMA census of the C reference
        run: |
          BINS="mafft-upstream/core/disttbfast mafft-upstream/core/tbfast mafft-upstream/core/dvtditr"
          case "$(uname -m)" in
            arm64|aarch64) PAT='\b(fmadd|fmsub|fnmadd|fnmsub|fmla|fmls)\b' ;;
            *)             PAT='\b(vfmadd|vfmsub|vfnmadd|vfnmsub)[0-9a-z]*' ;;
          esac
          echo "== fused multiply-add census of the freshly built C reference ($(uname -m))"
          for b in $BINS; do
            n=$(objdump -d "$b" | grep -cE "$PAT" || true)
            printf '  %-40s %6s FMA-family instructions\n' "$b" "$n"
          done
          echo "  (expected: ~1000 per binary for Apple clang, 0 for gcc including Linux aarch64)"
          if [ -x scripts/fma_census.sh ]; then
            echo "== scripts/fma_census.sh"
            scripts/fma_census.sh mafft-upstream/core | tee fma_census.txt
            if [ '${{ inputs.expect-zero-fused }}' = 'true' ]; then
              echo "== requiring 0 fused ops (gcc -std=c99, including Linux aarch64)"
              awk 'NR>1 {
                if ($3 != "0") {
                  printf "FAIL: %s fused_ops=%s (expected 0)\n", $1, $3 > "/dev/stderr"
                  bad=1
                }
              }
              END { if (NR < 2 || bad) exit 1 }' fma_census.txt
              echo "FMA census: 0 fused ops in disttbfast, dvtditr and tbfast"
            fi
          elif [ '${{ inputs.expect-zero-fused }}' = 'true' ]; then
            echo "FAIL: scripts/fma_census.sh is not executable" >&2
            exit 1
          else
            echo "== scripts/fma_census.sh not present in this checkout; inline census only"
          fi

      - name: Build Rust workspace
        run: cargo build --workspace ${{ inputs.cargo-exclude }}

      - name: Build Rust binary (release)
        run: cargo build -p mafft-rs --release

      - name: Run Rust tests (lib only, fast)
        run: cargo test --workspace ${{ inputs.cargo-exclude }} --lib

      - name: Run Rust integration tests (release)
        # `--tests` runs every `tests/*.rs` integration binary across the
        # workspace (end_to_end + cross_validate_* + trace_refinement,
        # etc.). Prior to this, only the named `end_to_end` binary ran, so
        # the cross-validate FFI tests + the imp_matrix correctness tests
        # were silently uncovered by CI. The cross_validate_* binaries
        # link the C compiled by mafft-c-bindings/build.rs on THIS runner,
        # so they check Rust's default fp policy against the matching C
        # build (FMA on Apple clang, none on gcc including Linux aarch64).
        run: cargo test --workspace ${{ inputs.cargo-exclude }} --release --tests

      - name: Smoke test Rust binary
        run: |
          ./target/release/mafft-rs -q mafft-upstream/test/sample > /dev/null
          echo "mafft-rs smoke test: PASS"

      # Cheap end-to-end sentinel for the FMA policy: `--bl 50` on the
      # 36-sequence sample is the known compiler-sensitive case (712
      # columns with Apple clang, 738 with gcc, including Linux aarch64).
      # The Rust binary built with its default policy must reproduce the C
      # built on the same runner byte-for-byte. The C wrapper script is
      # driven the same way the in-tree test/ recipes do it: point
      # MAFFT_BINARIES at the freshly populated mafft-upstream/binaries/.
      - name: FMA-policy sentinel (mafft-rs vs C, --bl 50)
        run: |
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          ARGS="--quiet --bl 50 --retree 2 --maxiterate 0"
          ./target/release/mafft-rs $ARGS mafft-upstream/test/sample > sentinel.rs.fa
          ./mafft-upstream/scripts/mafft $ARGS mafft-upstream/test/sample > sentinel.c.fa
          width() { awk '/^>/{if(n++) exit; next}{w+=length($0)} END{print w}' "$1"; }
          w_rs=$(width sentinel.rs.fa)
          w_c=$(width sentinel.c.fa)
          echo "host: $(uname -m)  mafft-rs width: $w_rs  C mafft width: $w_c"
          echo "(reference: Apple clang = 712 columns, gcc including Linux aarch64 = 738 columns)"
          expect='${{ inputs.expect-sentinel-width }}'
          if [ -n "$expect" ]; then
            if [ "$w_rs" != "$expect" ] || [ "$w_c" != "$expect" ]; then
              echo "FAIL: expected sentinel width $expect (mafft-rs=$w_rs C=$w_c)" >&2
              exit 1
            fi
            echo "sentinel width $expect: OK"
          fi
          diff sentinel.rs.fa sentinel.c.fa
          echo "FMA-policy sentinel: mafft-rs output IDENTICAL to same-platform C"

      # The policy-sensitive fixtures (`<name>.fma` / `<name>.nofma` under
      # crates/*/tests/fixtures, listed in policy_fixtures.tsv) are by
      # definition the output of the pinned upstream source built in-tree
      # with the default Makefile flags on the platform you run on -- i.e.
      # exactly the C we just built. Regenerate each from that build and
      # require it to be byte-identical to the checked-in variant for this
      # runner's policy (`.fma` on macOS, `.nofma` on Linux including
      # aarch64). The script prints a unified diff and fails the job on any
      # difference, and also
      # fails if a variant file exists that the manifest does not describe.
      - name: Regenerate policy-sensitive fixtures from the in-tree C build and diff
        run: |
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          scripts/regen_policy_fixtures.sh mafft-upstream/scripts/mafft check

      # Upload C binaries + scripts + test data as a single artifact
      - name: Prepare C test bundle
        if: ${{ inputs.upload-artifacts }}
        run: |
          mkdir -p c-test-bundle/binaries c-test-bundle/scripts c-test-bundle/test
          cp mafft-upstream/binaries/* c-test-bundle/binaries/
          cp mafft-upstream/scripts/* c-test-bundle/scripts/
          cp -r mafft-upstream/test/* c-test-bundle/test/

      - name: Upload C test bundle
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: c-test-bundle
          path: c-test-bundle/
          retention-days: 1

      - name: Upload Rust binary
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v5
        with:
          name: mafft-rs
          path: target/release/mafft-rs
          retention-days: 1
