name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ------------------------------------------------------------------
  # Build: compile the C reference in-tree, build the Rust workspace and
  # run the full test suite (lib + integration + FFI cross-validation).
  #
  # Runs once per reference platform via the reusable build-test.yml:
  # C MAFFT is not bit-identical across architectures (clang/arm64
  # contracts to FMA, gcc/x86-64 does not), so byte-identity has to be
  # checked against a same-platform C build on BOTH platforms. See the
  # header of build-test.yml and docs/architecture/byte-identity.md.
  #
  # Only the x86-64 leg uploads artifacts; the "Test C:" / "Test Rust:"
  # jobs below consume them and are x86-64 only.
  # ------------------------------------------------------------------
  build:
    name: "Build (x86-64)"
    uses: ./.github/workflows/build-test.yml
    with:
      os: ubuntu-latest
      upload-artifacts: true

  build-arm64:
    name: "Build (arm64)"
    uses: ./.github/workflows/build-test.yml
    with:
      os: macos-latest
      # pymafft's cdylib needs maturin's linker dance on macOS, not a
      # plain `cargo build`; everything else (including the FFI shim and
      # every cross_validate_* binary) builds and runs natively.
      cargo-exclude: "--exclude pymafft"

  # ------------------------------------------------------------------
  # FP-policy cross-check: run the fixture-based (non-FFI) test binaries
  # on the arm64 runner with the x86-64 policy forced via
  # `--features fp-contract-none`. `fixture_path_fp` then selects the
  # `<name>.nofma` fixtures, so this checks the x86-64 references from
  # an arm64 host (the mirror image, fp-contract-fma on ubuntu, is
  # deliberately not run).
  #
  # Only non-FFI binaries are selected: the cross_validate_* tests
  # compare against the C compiled on this runner, which contracts to
  # FMA, so under fp-contract-none they would be comparing two different
  # policies and are meaningless here.
  #
  # `--features` cannot be passed at the virtual-workspace root, hence
  # one `cargo test -p` per package.
  #
  # NOTE: `continue-on-error: true` is TEMPORARY. The fp-contract
  # features and the .fma/.nofma fixture convention land together with
  # the FMA-policy code; until that agent confirms the .nofma fixture
  # set is complete this job is advisory only. Remove the flag (and this
  # note) once it is green.
  # ------------------------------------------------------------------
  policy-cross-check:
    name: "FP policy: fp-contract-none fixtures on arm64"
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-policy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-policy-

      - name: Fixture tests under fp-contract-none (non-FFI binaries only)
        run: |
          set -x
          cargo test -p mafft-core  --release --features fp-contract-none --test end_to_end
          cargo test -p mafft-rs    --release --features fp-contract-none --test c_parity_dna
          cargo test -p mafft-align --release --features fp-contract-none \
            --test imp_matrix_correctness --test imp_zero_equiv

  # ------------------------------------------------------------------
  # MAFFT C alignment tests (each mode runs as a separate job)
  # ------------------------------------------------------------------
  test-fftns2:
    name: "Test C: FFT-NS-2 (default)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft sample > x 2>/dev/null
          diff x sample.fftns2

  test-fftnsi:
    name: "Test C: FFT-NS-i"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --maxiterate 100 sample > x 2>/dev/null
          diff x sample.fftnsi

  test-dpparttree:
    name: "Test C: dpparttree"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --dpparttree sample > x 2>/dev/null
          diff x sample.dpparttree

  test-gins1:
    name: "Test C: G-INS-1"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --globalpair sample > x 2>/dev/null
          diff x sample.gins1

  test-ginsi:
    name: "Test C: G-INS-i"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --globalpair --maxiterate 100 sample > x 2>/dev/null
          diff x sample.ginsi

  test-ginsi-allowshift:
    name: "Test C: G-INS-i (allowshift)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --allowshift --globalpair --maxiterate 100 sample > x 2>/dev/null
          diff x sample.ginsi.allowshift

  test-lins1:
    name: "Test C: L-INS-1"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --localpair sample > x 2>/dev/null
          diff x sample.lins1

  test-linsi:
    name: "Test C: L-INS-i"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --localpair --maxiterate 100 sample > x 2>/dev/null
          diff x sample.linsi

  test-parttree:
    name: "Test C: parttree"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
      - name: Run test
        run: |
          chmod +x binaries/* scripts/*
          export PATH="$PWD/binaries:$PWD/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/binaries"
          cd test
          mafft --parttree sample > x 2>/dev/null
          diff x sample.parttree

  # ------------------------------------------------------------------
  # Rust binary validation
  # ------------------------------------------------------------------
  test-rust-binary:
    name: "Test Rust: mafft-rs binary"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: mafft-rs
      - uses: actions/download-artifact@v5
        with:
          name: c-test-bundle
          path: c-test-bundle
      - name: Validate output
        run: |
          chmod +x mafft-rs
          ./mafft-rs -q c-test-bundle/test/sample > rust_out.fasta
          SEQ_COUNT=$(grep -c '^>' rust_out.fasta)
          [ "$SEQ_COUNT" -eq 36 ] || { echo "FAIL: expected 36 sequences, got $SEQ_COUNT"; exit 1; }
          python3 -c "
          seqs = {}; name = None
          for line in open('rust_out.fasta'):
              line = line.strip()
              if line.startswith('>'): name = line; seqs[name] = ''
              elif name: seqs[name] += line
          widths = set(len(s) for s in seqs.values())
          assert len(widths) == 1, f'Inconsistent widths: {widths}'
          print(f'OK: {len(seqs)} sequences, width {widths.pop()}')
          "
          echo "Rust binary test: PASS"

  # ------------------------------------------------------------------
  # Cross-platform sanity build — release.yml / python.yml ship Windows
  # artifacts; we should at least know that `cargo build` + lib tests
  # work there on every PR. macOS used to be in this light matrix but is
  # now covered by the full `build-arm64` job above (C build, FFI
  # cross-validation, byte-identity); Linux `build` and `build-arm64`
  # are the two authoritative byte-identity gates.
  #
  # Excluded:
  #   - pymafft           : its cdylib needs maturin's linker dance,
  #                         not a plain `cargo build`
  #   - mafft-c-bindings  : compiles MAFFT's C source which links
  #                         pthread + uses POSIX-only headers; fails on
  #                         Windows MSVC
  #
  # We also limit `cargo test` to the crates that have NO dev-dep on
  # mafft-c-bindings — otherwise the cross_validate_* test binaries
  # would still pull it in via dev-deps and fail to link on Windows.
  # ------------------------------------------------------------------
  cross-platform:
    name: "Cross-platform: ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-xp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-xp-

      - name: Build (workspace minus pymafft + C shim)
        run: cargo build --workspace --exclude pymafft --exclude mafft-c-bindings --release

      - name: Unit tests (FFI-independent crates)
        run: >
          cargo test --release --lib
          -p mafft-types
          -p mafft-io
          -p mafft-fft
          -p mafft-align
          -p mafft-rs
          -p mafft

      - name: Smoke-test mafft-rs binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./target/release/mafft-rs.exe --version
          else
            ./target/release/mafft-rs --version
          fi
