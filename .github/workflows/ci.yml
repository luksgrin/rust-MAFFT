name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ------------------------------------------------------------------
  # Build: compile C binaries and Rust workspace
  # ------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build C binaries
        run: make -C mafft-upstream/core

      - name: Build Rust workspace
        run: cargo build --workspace

      - name: Build Rust binary (release)
        run: cargo build -p mafft-bin --release

      - name: Run Rust tests (lib only, fast)
        run: cargo test --workspace --lib

      - name: Run Rust integration tests (release)
        run: cargo test -p mafft-core --release --test end_to_end

      - name: Smoke test Rust binary
        run: |
          ./target/release/mafft-rs -q mafft-upstream/test/sample > /dev/null
          echo "mafft-rs smoke test: PASS"

      # Upload the built binaries + scripts so test jobs can use them
      - name: Upload C binaries
        uses: actions/upload-artifact@v4
        with:
          name: mafft-binaries
          path: |
            mafft-upstream/binaries/
            mafft-upstream/scripts/
          retention-days: 1

      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: mafft-rs
          path: target/release/mafft-rs
          retention-days: 1

  # ------------------------------------------------------------------
  # MAFFT C alignment tests (each mode runs as a separate job)
  # ------------------------------------------------------------------
  test-fftns2:
    name: "Test C: FFT-NS-2 (default)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft sample > x 2>/dev/null
          diff x sample.fftns2

  test-fftnsi:
    name: "Test C: FFT-NS-i"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --maxiterate 100 sample > x 2>/dev/null
          diff x sample.fftnsi

  test-dpparttree:
    name: "Test C: dpparttree"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --dpparttree sample > x 2>/dev/null
          diff x sample.dpparttree

  test-gins1:
    name: "Test C: G-INS-1"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --globalpair sample > x 2>/dev/null
          diff x sample.gins1

  test-ginsi:
    name: "Test C: G-INS-i"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --globalpair --maxiterate 100 sample > x 2>/dev/null
          diff x sample.ginsi

  test-ginsi-allowshift:
    name: "Test C: G-INS-i (allowshift)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --allowshift --globalpair --maxiterate 100 sample > x 2>/dev/null
          diff x sample.ginsi.allowshift

  test-lins1:
    name: "Test C: L-INS-1"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --localpair sample > x 2>/dev/null
          diff x sample.lins1

  test-linsi:
    name: "Test C: L-INS-i"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --localpair --maxiterate 100 sample > x 2>/dev/null
          diff x sample.linsi

  test-parttree:
    name: "Test C: parttree"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-binaries
      - name: Run test
        run: |
          chmod +x mafft-upstream/binaries/* mafft-upstream/scripts/*
          export PATH="$PWD/mafft-upstream/binaries:$PWD/mafft-upstream/scripts:$PATH"
          export MAFFT_BINARIES="$PWD/mafft-upstream/binaries"
          cd mafft-upstream/test
          mafft --parttree sample > x 2>/dev/null
          diff x sample.parttree

  # ------------------------------------------------------------------
  # Rust binary validation
  # ------------------------------------------------------------------
  test-rust-binary:
    name: "Test Rust: mafft-rs binary"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: mafft-rs
      - name: Validate output
        run: |
          chmod +x mafft-rs
          ./mafft-rs -q mafft-upstream/test/sample > rust_out.fasta
          SEQ_COUNT=$(grep -c '^>' rust_out.fasta)
          [ "$SEQ_COUNT" -eq 36 ] || { echo "FAIL: expected 36 sequences, got $SEQ_COUNT"; exit 1; }
          python3 -c "
          seqs = {}; name = None
          for line in open('rust_out.fasta'):
              line = line.strip()
              if line.startswith('>'): name = line; seqs[name] = ''
              elif name: seqs[name] += line
          widths = set(len(s) for s in seqs.values())
          assert len(widths) == 1, f'Inconsistent widths: {widths}'
          print(f'OK: {len(seqs)} sequences, width {widths.pop()}')
          "
          echo "Rust binary test: PASS"
