name: Python Package

# The extension is built against the stable ABI (PyO3 `abi3-py39`), so
# each target gets ONE wheel, tagged `cp39-abi3`, that installs on every
# CPython >= 3.9: 5 wheels + sdist per release. Only the wheel tests have
# a Python axis, and every leg installs the same wheel artifact.
#
# Two test regimes, selected by the `matrix` job below:
#
#   * push / pull_request  -> SMOKE: all 5 wheels, sdist, wheel tests on
#                             Python 3.12. Nothing is published.
#   * release / dispatch   -> FULL: all 5 wheels, sdist, wheel tests on
#                             Python 3.9/3.12/3.14, then publish
#                             (release only).
#
# Only run for changes that can reach a wheel: the Rust workspace (the
# wheel bundles the `mafft-rs` binary, so every crate counts), the Cargo
# manifests/lockfile, and this workflow. Docs, Markdown anywhere, the other
# workflows, citation and licences are filtered out by the positive
# `paths` list -- a `paths-ignore` list has to enumerate every irrelevant
# file and silently lets new ones through. `crates/pymafft/README.md` is
# the one Markdown file that does land in the wheel (pyproject `readme`),
# but it cannot break a build, so it is excluded with the rest. Note that
# a path filter makes a required status check go *missing* rather than
# pass; keep that in mind if branch protection is ever enabled.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '!crates/**/*.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
  # Any base branch: stacked PRs (feature -> feature) get checks too.
  # Keep this list identical to the `push` one above.
  pull_request:
    paths:
      - 'crates/**'
      - '!crates/**/*.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
  # Publish on version tags
  release:
    types: [published]
  # Manual trigger for testing (runs the FULL matrix, does not publish)
  workflow_dispatch:

# A new push to the same PR (or to main) supersedes the run in flight;
# cancel it instead of finishing wheels nobody will look at. Release and
# dispatch runs are keyed by ref/run and are never cancelled by a later
# push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Select the matrix regime. Emits the JSON list of Python versions that
  # `test-wheels` feeds through `fromJSON` into its `strategy.matrix`, so
  # the job body exists exactly once and only the Python axis varies.
  # `build-wheels` has no Python axis: abi3 makes the wheel the same for
  # every interpreter.
  # ------------------------------------------------------------------
  matrix:
    name: Select matrix
    runs-on: ubuntu-latest
    outputs:
      test-python: ${{ steps.select.outputs.test-python }}
    steps:
      - id: select
        env:
          FULL: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "regime: FULL (${{ github.event_name }})"
            echo 'test-python=["3.9", "3.12", "3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo "regime: SMOKE (${{ github.event_name }})"
            echo 'test-python=["3.12"]' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Build one abi3 wheel per target. maturin needs a single interpreter
  # to drive the build (3.12 below); the resulting `cp39-abi3` wheel does
  # not depend on which one it was.
  #
  # Each wheel embeds the compiled `mafft-rs` CLI binary under
  # `pymafft/_bin/`. `pip install pymafft` exposes `mafft-rs` on $PATH via
  # the `[project.scripts]` entry in pyproject.toml — see
  # `python/pymafft/__main__.py`. So the same wheel provides the
  # programmatic API (`import pymafft`) AND the standalone CLI.
  # ------------------------------------------------------------------
  build-wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_28"
          # macos-latest is Apple Silicon; we cross-compile to
          # x86_64-apple-darwin from there (Rust handles this fine with
          # the target installed). The retired macos-13 runner used to
          # be native Intel but has been removed by GitHub as of 2026.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ----- Non-Linux: build the CLI binary on the host runner. -----
      - name: Install Rust + target (non-Linux)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build mafft-rs CLI (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release -p mafft-rs --target ${{ matrix.target }}
          mkdir -p crates/pymafft/python/pymafft/_bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/mafft-rs.exe \
               crates/pymafft/python/pymafft/_bin/
          else
            cp target/${{ matrix.target }}/release/mafft-rs \
               crates/pymafft/python/pymafft/_bin/
          fi

      # ----- Build the wheel. On Linux, also pre-build the CLI binary
      #       inside the manylinux container via `before-script-linux`
      #       so it links against the same glibc as the cdylib.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          working-directory: crates/pymafft
          args: --release --out dist -i python3.12
          # `sccache: true` was set here previously but breaks Linux
          # builds: maturin-action exports RUSTC_WRAPPER=sccache and the
          # manylinux container doesn't ship sccache, so the cargo call
          # inside `before-script-linux` fails with "sccache: No such
          # file or directory" before the wheel build even starts. The
          # speed win on macOS/Windows is small relative to total matrix
          # time (~3-5 min), so we just disable sccache across the board.
          #
          # before-script-linux runs in the manylinux container with cwd
          # = crates/pymafft (matches `working-directory:` above). We
          # MUST NOT cd elsewhere — any leftover cwd change persists for
          # maturin's own invocation and lands it on the workspace root
          # Cargo.toml, which has no [package] and fails parse. Use
          # --manifest-path for cargo and relative paths for cp.
          before-script-linux: |
            cargo build --manifest-path ../../Cargo.toml \
                        --release -p mafft-rs \
                        --target ${{ matrix.target }}
            mkdir -p python/pymafft/_bin
            cp ../../target/${{ matrix.target }}/release/mafft-rs \
               python/pymafft/_bin/

      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.target }}
          path: crates/pymafft/dist/*.whl

  # ------------------------------------------------------------------
  # The bindings must compile without warnings, so PyO3 deprecations
  # are dealt with when they appear instead of piling up until the next
  # upgrade. `cargo check` rather than `cargo build`: it covers every
  # lint without linking the cdylib, which needs maturin's linker
  # arguments on macOS.
  # ------------------------------------------------------------------
  lint:
    name: pymafft builds warning-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo check -p pymafft (-D warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p pymafft --locked

  # ------------------------------------------------------------------
  # Build sdist
  # ------------------------------------------------------------------
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pymafft
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: crates/pymafft/dist/*.tar.gz

  # ------------------------------------------------------------------
  # Test wheels on native runners (one target per OS; cross-compiled
  # aarch64-linux wheels are exercised via QEMU at publish time, not
  # here — installing them on x86_64 would fail by design).
  #
  # The `python` axis installs the SAME abi3 wheel (`wheels-<target>`)
  # on each interpreter, which is what checks the stable-ABI claim: the
  # oldest supported (3.9), the build interpreter (3.12) and the newest
  # (3.14).
  #
  # `target` is a real matrix axis and `include` only decorates each
  # target with its runner. The previous layout (`include` as the sole
  # source of targets next to a `python` axis) let each later include
  # entry overwrite the target/os added by the previous one, so only the
  # Windows tests ever ran.
  # ------------------------------------------------------------------
  test-wheels:
    name: Test (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: [matrix, build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # x86_64-apple-darwin is built (cross-compiled from arm64 above)
          # but NOT tested here — installing an x86_64 wheel on an arm64
          # macos-latest runner would need Rosetta + pip --platform overrides;
          # the wheel itself is the same code as the arm64 build, so we
          # consider it sufficiently exercised by the aarch64-apple-darwin leg.
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        # 3.9/3.12/3.14 on release/dispatch, 3.12 only on push/PR (see
        # `matrix`).
        python: ${{ fromJSON(needs.matrix.outputs.test-python) }}
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: wheels-${{ matrix.target }}
          path: dist

      - name: Install wheel + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Fails the step if the artifact is not the stable-ABI wheel.
          ls dist/pymafft-*-cp39-abi3-*.whl
          pip install pytest biopython
          # --no-index: install ONLY the wheel we just built. Without it pip
          # also consults PyPI, and when the published version equals the
          # workspace version (any change without a bump) it may pick the
          # published wheel instead, so the tests silently run against the
          # old package. Seen on the Windows runners of PR #7.
          pip install --no-index --find-links dist pymafft
          # No pipes here: the step runs with pipefail, and `pip show | head`
          # makes pip exit 120 ("Pipe to stdout was broken") once head closes.
          python -c "import pymafft; print('pymafft', pymafft.__version__, 'from', pymafft.__file__)"

      - name: Run binding test suite
        working-directory: crates/pymafft
        run: pytest tests/ -v

      - name: Smoke-test bundled CLI
        shell: bash
        run: |
          mafft-rs --help | head -1
          python -m pymafft --help | head -1

  # ------------------------------------------------------------------
  # Publish to PyPI (only on release tags)
  # ------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [lint, build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/project/pymafft/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
