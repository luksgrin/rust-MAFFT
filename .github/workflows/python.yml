name: Python Package

on:
  # Build on every push/PR (but don't publish)
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Publish on version tags
  release:
    types: [published]
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Build wheels for all platforms
  # ------------------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pymafft
          args: --release --out dist
          sccache: "true"
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/pymafft/dist/*.whl

  # ------------------------------------------------------------------
  # Build sdist
  # ------------------------------------------------------------------
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pymafft
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/pymafft/dist/*.tar.gz

  # ------------------------------------------------------------------
  # Test wheels
  # ------------------------------------------------------------------
  test-wheels:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

      - name: Install wheel and test deps
        run: |
          pip install pytest
          pip install --find-links dist pymafft

      - name: Run tests
        working-directory: crates/pymafft
        run: pytest tests/ -v

  # ------------------------------------------------------------------
  # Publish to PyPI (only on release tags)
  # ------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/project/pymafft/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
