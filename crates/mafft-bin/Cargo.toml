[package]
name = "mafft-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MAFFT multiple sequence alignment tool (Rust implementation)"
readme = "README.md"

[lib]
name = "mafft_rs"
path = "src/lib.rs"

[[bin]]
name = "mafft-rs"
path = "src/main.rs"

[dependencies]
mafft-core = { path = "../mafft-core", version = "0.1.0" }
mafft-io = { path = "../mafft-io", version = "0.1.0" }
mafft-types = { path = "../mafft-types", version = "0.1.0" }
mafft-tree = { path = "../mafft-tree", version = "0.1.0" }
mafft-scoring = { path = "../mafft-scoring", version = "0.1.0" }
mafft-align = { path = "../mafft-align", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
rayon = "1"

# Floating-point contraction policy (see `mafft_types::fp`). Mutually
# exclusive; with neither, the build fuses `a*b+c` on aarch64 (mirroring the
# arm64 clang reference C build) and not elsewhere (mirroring baseline
# x86-64 gcc). Forwarded to every dependency that carries FP arithmetic so
# `--features fp-contract-none` on any crate switches the whole stack.
[features]
fp-contract-fma = [
    "mafft-core/fp-contract-fma",
    "mafft-io/fp-contract-fma",
    "mafft-types/fp-contract-fma",
    "mafft-tree/fp-contract-fma",
    "mafft-scoring/fp-contract-fma",
    "mafft-align/fp-contract-fma",
]
fp-contract-none = [
    "mafft-core/fp-contract-none",
    "mafft-io/fp-contract-none",
    "mafft-types/fp-contract-none",
    "mafft-tree/fp-contract-none",
    "mafft-scoring/fp-contract-none",
    "mafft-align/fp-contract-none",
]
