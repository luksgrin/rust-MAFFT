[package]
name = "mafft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core MAFFT alignment engine: progressive alignment and iterative refinement"
readme = "README.md"

[dependencies]
mafft-types = { path = "../mafft-types", version = "0.1.0" }
mafft-scoring = { path = "../mafft-scoring", version = "0.1.0" }
mafft-align = { path = "../mafft-align", version = "0.1.0" }
mafft-tree = { path = "../mafft-tree", version = "0.1.0" }
mafft-fft = { path = "../mafft-fft", version = "0.1.0" }
mafft-io = { path = "../mafft-io", version = "0.1.0" }
rayon = "1"

[dev-dependencies]
# See note in mafft-scoring/Cargo.toml — alias preserves `use mafft_sys`
# in cross_validate_* test files while the real crate is internal-only.
mafft-sys = { path = "../mafft-c-bindings", package = "mafft-c-bindings" }
num-complex = "0.4"
libc = "0.2"
