[package]
name = "mafft-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure Rust types for MAFFT multiple sequence alignment"
readme = "../../README.md"

[dependencies]
num-complex = "0.4"
mafft-sys = { path = "../mafft-sys", optional = true }

[features]
# Enable FFI conversions between Rust types and the C `mafft_sys` bindings.
# Off by default — only needed for the FFI-bridged build path.
ffi = ["dep:mafft-sys"]
