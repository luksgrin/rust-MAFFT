[package]
name = "pymafft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Python bindings for MAFFT-rs multiple sequence alignment"
readme = "../../README.md"
publish = false

[lib]
name = "pymafft"
crate-type = ["cdylib"]

[dependencies]
mafft-core = { path = "../mafft-core", version = "0.2.0" }
mafft-io = { path = "../mafft-io", version = "0.2.0" }
mafft-types = { path = "../mafft-types", version = "0.2.0" }
# The CLI's flag layer. Every pymafft option becomes a `mafft-rs` flag and
# runs through `mafft_rs::run_from_seqs`, so flag semantics are decided in
# exactly one place and the Python output is byte-identical to the CLI's.
mafft-rs = { path = "../mafft-bin", version = "0.2.0" }
# `abi3-py39`: build against the stable ABI, so one wheel per target serves
# every CPython >= 3.9 (the `requires-python` floor in pyproject.toml).
# `extension-module` is not enabled here. In PyO3 0.30 that feature skips
# linking libpython for every artifact, including `cargo test` binaries, so
# the harness dies with undefined `Py*` symbols wherever the linker does not
# discard them (Linux aarch64 release). Wheel builds still skip that link:
# maturin >= 1.9.4 sets `PYO3_BUILD_EXTENSION_MODULE` and pyproject.toml
# passes `--features pyo3/extension-module`.
pyo3 = { version = "0.30", features = ["abi3-py39"] }

# Floating-point contraction policy (see `mafft_types::fp`). Mutually
# exclusive; with neither, the build fuses `a*b+c` on Apple targets
# (mirroring Apple clang) and not elsewhere (mirroring gcc `-std=c99`,
# including Linux aarch64, and MSVC). Forwarded to every dependency that
# carries FP arithmetic so `--features fp-contract-none` on any crate
# switches the whole stack.
[features]
fp-contract-fma = [
    "mafft-core/fp-contract-fma",
    "mafft-io/fp-contract-fma",
    "mafft-types/fp-contract-fma",
    "mafft-rs/fp-contract-fma",
]
fp-contract-none = [
    "mafft-core/fp-contract-none",
    "mafft-io/fp-contract-none",
    "mafft-types/fp-contract-none",
    "mafft-rs/fp-contract-none",
]
