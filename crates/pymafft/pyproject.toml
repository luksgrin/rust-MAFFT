[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pymafft"
version = "0.1.0"
description = "Python bindings for MAFFT-rs multiple sequence alignment"
readme = "README.md"
license = {text = "MIT AND BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "Lucas Goiriz", email = "luksgrin@users.noreply.github.com"},
]
keywords = ["bioinformatics", "alignment", "msa", "fasta", "mafft", "sequence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/luksgrin/rust-MAFFT"
Repository = "https://github.com/luksgrin/rust-MAFFT"
Issues = "https://github.com/luksgrin/rust-MAFFT/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
