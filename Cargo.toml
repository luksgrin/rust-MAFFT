[workspace]
members = [
    "crates/mafft-c-bindings",
    "crates/mafft-sys",
    "crates/mafft-types",
    "crates/mafft-io",
    "crates/mafft-scoring",
    "crates/mafft-fft",
    "crates/mafft-align",
    "crates/mafft-tree",
    "crates/mafft-core",
    "crates/mafft-bin",
    "crates/mafft",
    "crates/pymafft",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/luksgrin/rust-MAFFT"
homepage = "https://github.com/luksgrin/rust-MAFFT"
description = "MAFFT multiple sequence alignment - Rust rewrite"
authors = ["Lucas Goiriz <luksgrin@users.noreply.github.com>"]
keywords = ["bioinformatics", "alignment", "msa", "fasta", "mafft"]
categories = ["science", "command-line-utilities"]
readme = "README.md"

# Release with LTO + single codegen unit. Enables cross-crate inlining of
# the hot DP path (profile_align_imp_multimtx is inlined into iterative_refine,
# letting LLVM eliminate redundant bounds checks and hoist invariants across
# the function boundary). Cost: ~30 s extra link time on full builds. Win:
# closes the FFT-NS-i wall-clock gap vs C MAFFT — see TODO §C.2.
[profile.release]
lto = "fat"
codegen-units = 1

# Profile with debug symbols (for samply/cargo-flamegraph). Same codegen as
# release, but keeps function names so profilers show meaningful labels.
# Build with: cargo build --profile profiling --bin mafft-rs
[profile.profiling]
inherits = "release"
debug = true
