[workspace]
members = [
    "crates/mafft-sys",
    "crates/mafft-types",
    "crates/mafft-io",
    "crates/mafft-scoring",
    "crates/mafft-fft",
    "crates/mafft-align",
    "crates/mafft-tree",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/luksgrin/rust-MAFFT"
description = "MAFFT multiple sequence alignment - Rust rewrite"
